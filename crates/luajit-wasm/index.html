<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LuaJIT Playground</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #1e1e2e;
    color: #cdd6f4;
    display: flex; height: 100vh; overflow: hidden;
  }
  .panel { flex: 1; display: flex; flex-direction: column; }
  .panel-header {
    padding: 8px 16px; font-size: 12px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 1px;
    background: #181825; border-bottom: 1px solid #313244;
    display: flex; justify-content: space-between; align-items: center;
  }
  .hint { font-size: 10px; color: #585b70; }
  .run-btn {
    padding: 6px 16px; border: none; border-radius: 6px;
    background: #a6e3a1; color: #1e1e2e; font-weight: 700;
    cursor: pointer; font-size: 13px; transition: background 0.2s;
  }
  .run-btn:hover { background: #94e2d5; }
  .run-btn:active { transform: scale(0.97); }
  textarea {
    flex: 1; background: #1e1e2e; color: #cdd6f4; border: none;
    padding: 16px;
    font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
    font-size: 14px; line-height: 1.6; resize: none; outline: none; tab-size: 2;
  }
  textarea::placeholder { color: #585b70; }
  #output {
    flex: 1; padding: 16px;
    font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
    font-size: 14px; line-height: 1.6; white-space: pre-wrap; overflow-y: auto;
    color: #a6adc8;
  }
  #output:empty::after { content: "Run code to see output"; color: #585b70; }
  .divider { width: 1px; background: #313244; }
  .status-bar {
    padding: 4px 16px; font-size: 11px; background: #181825;
    color: #585b70; border-top: 1px solid #313244;
    display: flex; gap: 16px;
  }
  .output-print { color: #89b4fa; }
  .output-result { color: #a6e3a1; }
  .output-error { color: #f38ba8; }
  #loader {
    position: fixed; inset: 0; display: flex; align-items: center;
    justify-content: center; background: #1e1e2e; z-index: 10;
  }
  #loader.hidden { display: none; }
  .spinner {
    width: 32px; height: 32px; border: 3px solid #313244;
    border-top-color: #a6e3a1; border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 600px) {
    body { flex-direction: column; }
    .divider { width: 100%; height: 1px; }
    textarea { min-height: 40vh; }
  }
</style>
</head>
<body>

<div id="loader"><div class="spinner"></div></div>

<div class="panel">
  <div class="panel-header">
    <span>Lua Code <span class="hint">Ctrl+Enter</span></span>
    <button class="run-btn" id="runBtn" disabled>Loading...</button>
  </div>
  <textarea id="editor" placeholder="-- Write Lua code here...
print(&quot;Hello from LuaJIT!&quot;)

function fib(n)
  if n &lt; 2 then return n end
  return fib(n-1) + fib(n-2)
end

return fib(30)" spellcheck="false"></textarea>
  <div class="status-bar">
    <span id="gcInfo">GC: --</span>
    <span id="timeInfo">Time: --</span>
  </div>
</div>

<div class="divider"></div>

<div class="panel">
  <div class="panel-header">Output</div>
  <div id="output"></div>
</div>

<script type="module">
import init, { LuaWasm } from "./pkg/luajit_wasm.js";

const editor = document.getElementById("editor");
const outputEl = document.getElementById("output");
const runBtn = document.getElementById("runBtn");
const loader = document.getElementById("loader");
const gcInfo = document.getElementById("gcInfo");
const timeInfo = document.getElementById("timeInfo");

let lua = null;

async function boot() {
  await init();
  lua = new LuaWasm();
  runBtn.textContent = "Run \u25B6";
  runBtn.disabled = false;
  loader.classList.add("hidden");
  updateStatus();
}

function updateStatus() {
  gcInfo.textContent = `GC: ${lua.gc_count().toFixed(1)} KB`;
}

function append(text, cls) {
  const div = document.createElement("div");
  div.className = cls || "";
  div.textContent = text;
  outputEl.appendChild(div);
  outputEl.scrollTop = outputEl.scrollHeight;
}

function run() {
  outputEl.innerHTML = "";
  const src = editor.value;
  if (!src.trim()) return;

  const t0 = performance.now();

  try {
    const result = lua.do_string(src);
    if (result !== "" && result !== "null") {
      append(result, "output-result");
    }
    timeInfo.textContent = `Time: ${(performance.now() - t0).toFixed(1)} ms`;
    updateStatus();
    lua.gc_collect();
  } catch (e) {
    timeInfo.textContent = `Time: ${(performance.now() - t0).toFixed(1)} ms`;
    append(String(e).replace(/^Error: /, ""), "output-error");
  }
}

runBtn.addEventListener("click", run);
editor.addEventListener("keydown", (e) => {
  if (e.ctrlKey && e.key === "Enter") { e.preventDefault(); run(); }
});

boot();
</script>
</body>
</html>
